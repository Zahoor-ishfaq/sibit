[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sibit"
version = "1.0.0"
description = "Sibit — Firewall Migration Rule Verifier (Cisco ASA → FTD)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "ciscoconfparse2>=0.9",
  "netaddr>=1.3",
  "polars>=1.0",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "python-calamine>=0.3",
  "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pyinstaller>=6.6", "playwright>=1.45", "pillow>=10.1", "fonttools>=4.50", "brotli"]

[project.scripts]
sibit = "sibit.__main__:main"

[tool.setuptools.packages.find]
include = ["sibit*"]

[tool.setuptools.package-data]
sibit = ["web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
