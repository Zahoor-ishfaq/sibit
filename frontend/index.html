<!doctype html>
<html lang="en" class="dark" data-density="comfortable">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Sibit — Firewall Migration Rule Verifier</title>
    <script>
      // Apply the saved theme before first paint (no flash). Dark is the default.
      try {
        var t = localStorage.getItem("sibit.theme") || "dark";
        var d = localStorage.getItem("sibit.density") || "comfortable";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.density = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
